# ============================================================
# FocalDive Clips - full production stack
# ============================================================
#   web   (Next.js)  :3000  ─▶ api
#   api   (NestJS + bundled Python pipeline) :4000 ─▶ postgres, redis
#   postgres (data)  :5432
#   redis    (queue) :6379
#
# The API spawns the Python pipeline (run.py) as a child process and writes
# clips into the shared `workspace` volume, which it also serves over /files.
#
# Quick start:
#   1. cp .env.docker.example .env.docker  &&  fill in real values
#   2. docker compose --env-file .env.docker up --build -d
#   3. open http://localhost:3000
#
# The standalone `pipeline` image (profile: tools) is for manual one-off runs;
# it is NOT needed for the normal flow since the api image bundles the pipeline.
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-focaldive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-focaldive}
      POSTGRES_DB: ${POSTGRES_DB:-focaldive}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-focaldive} -d ${POSTGRES_DB:-focaldive}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Host 5434 → container 5432. Bound to localhost only (nginx/tools reach it
      # locally; never public). 5433 is taken by another stack on this host.
      # Container-to-container traffic uses the service name + 5432, unaffected.
      - "127.0.0.1:5434:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Host 6380 → container 6379, localhost only. 6379 is taken by another
      # stack on this host. The API reaches redis via the service name internally.
      - "127.0.0.1:6380:6379"

  api:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # ── Core ──
      API_PORT: 4000
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      NODE_ENV: production
      # ── Real pipeline + local file serving ──
      USE_REAL_PIPELINE: "true"
      LOCAL_FILES: "true"
      PIPELINE_REPO_ROOT: /app
      PYTHON_BIN: python3
      # ── Data / queue ──
      DATABASE_URL: postgresql://${POSTGRES_USER:-focaldive}:${POSTGRES_PASSWORD:-focaldive}@postgres:5432/${POSTGRES_DB:-focaldive}?schema=public
      # NOTE: REDIS_URL is intentionally NOT set on the API. With it set, the API
      # becomes a BullMQ *producer only* and jobs need the separate Python BullMQ
      # consumer (worker.py Phase 2), which isn't built yet - jobs would sit
      # queued forever. Unset, the API uses its in-process MemoryQueue +
      # RealPipelineWorker, which spawns pipeline/run.py and processes jobs (the
      # verified working path). Redis still runs below for future use / caching.
      # REDIS_URL: redis://redis:6379
      # ── Mock toggles ──
      MOCK_MODE: ${MOCK_MODE:-auto}
      # Real auth by default now (Auth.js + Google). Set MOCK_AUTH=true in .env
      # to fall back to the injected dev org.
      MOCK_AUTH: ${MOCK_AUTH:-false}
      # ── Pipeline AI keys (free CPU path) ──
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-whisper-large-v3}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      SCORING_PROVIDER: ${SCORING_PROVIDER:-gemini}
      TRANSCRIBE_BACKEND: ${TRANSCRIBE_BACKEND:-groq}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # ── yt-dlp YouTube auth (bot-check fix) ──
      # A datacenter/VPS IP gets "Sign in to confirm you're not a bot". Supplying
      # a logged-in cookies.txt makes yt-dlp look like a real user. The default
      # path points at the ./secrets mount below; leave the file absent to run
      # cookie-less (fine until YouTube blocks the IP). YTDLP_COOKIES_FROM_BROWSER
      # is the alt seam (only useful if the container has a browser profile).
      YTDLP_COOKIES: ${YTDLP_COOKIES:-/secrets/cookies.txt}
      YTDLP_COOKIES_FROM_BROWSER: ${YTDLP_COOKIES_FROM_BROWSER:-}
      # ── Billing (Polar.sh) ──
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_BASE_URL: ${POLAR_BASE_URL:-https://sandbox-api.polar.sh}
      POLAR_MODE: ${POLAR_MODE:-sandbox}
      POLAR_PRODUCT_STARTER: ${POLAR_PRODUCT_STARTER:-}
      POLAR_PRODUCT_PRO: ${POLAR_PRODUCT_PRO:-}
      # Pro annual (60% off) product; "packs" reuse the Pro products via quantity.
      POLAR_PRODUCT_PRO_ANNUAL: ${POLAR_PRODUCT_PRO_ANNUAL:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL:-http://localhost:3000/billing?ok=1}
      BILLING_CANCEL_URL: ${BILLING_CANCEL_URL:-http://localhost:3000/billing?canceled=1}
      # ── Email (optional) ──
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-ClipsHQ <clips@clipshq.pro>}
      # SMTP for the API "clips ready" email (empty SMTP_HOST => logs, no send).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      # ── Auth (self-hosted: Auth.js v5 + Google) ──
      # AUTH_JWT_SECRET verifies the HS256 app token the web mints; when it (and
      # MOCK_AUTH=false) are set the API enforces real auth. AUTH_INTERNAL_SECRET
      # guards the internal /auth/sync|login|register endpoints the web calls.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_INTERNAL_SECRET: ${AUTH_INTERNAL_SECRET:-}
      # System admin seeded into Postgres (admin panel login).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@focaldive.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme-admin}
      ADMIN_NAME: ${ADMIN_NAME:-FocalDive Admin}
    volumes:
      - workspace:/app/workspace
      # yt-dlp cookies (bot-check fix), read-only. Host ./secrets/cookies.txt →
      # container /secrets/cookies.txt (the YTDLP_COOKIES default above). The
      # ./secrets dir is gitignored; create it + drop cookies.txt on the server.
      # If the dir/file is absent Docker still starts (bind of a missing source
      # errors, so we keep the whole ./secrets dir which you create once).
      - ./secrets:/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    ports:
      # Host 4006 → container 4000, localhost only (nginx proxies to it).
      # 4000/4005 are taken by another stack on this host.
      - "127.0.0.1:4006:4000"

  web:
    build:
      context: ./app/web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined at BUILD time - must be a build arg, not just
        # runtime env. Browsers hit the API at this public URL.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        # Turns on the real sign-in UI + route protection (also build-time).
        NEXT_PUBLIC_AUTH_ENABLED: ${NEXT_PUBLIC_AUTH_ENABLED:-true}
        # Canonical public origin for SEO (canonical/OG/sitemap/robots/llms.txt).
        # Falls back to localhost for local dev; set to https://clipshq.pro in prod.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Runtime fallback (the build arg already inlined the public value).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_AUTH_ENABLED: ${NEXT_PUBLIC_AUTH_ENABLED:-true}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # ── Auth.js (NextAuth) server-side config ──
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Canonical app URL Auth.js uses to build OAuth callback URLs.
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      # Server-side URL the web uses to reach the API INSIDE the compose network
      # (service name, not localhost) for /auth/sync|login|register.
      API_INTERNAL_URL: http://api:4000
      # Google OAuth web client.
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      # Shared with the API: mints the HS256 app token + guards internal calls.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_INTERNAL_SECRET: ${AUTH_INTERNAL_SECRET:-}
    ports:
      # Host 3000 → container 3000, localhost only (nginx proxies to it).
      - "127.0.0.1:3000:3000"

  # One-off pipeline runner (manual use only). Not part of the normal flow.
  #   docker compose --profile tools run --rm pipeline \
  #     python run.py "<url>" --clips 3 --job-id demo --json-progress
  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    profiles: ["tools"]
    env_file:
      - .env.docker
    volumes:
      - workspace:/app/workspace

volumes:
  pgdata:
  redisdata:
  workspace:
